name: fork-drift-alarm

# Alarm only: red means agent0ai/spynel moved past the tip recorded in
# docs/tracking/upstream-reviewed.sha and this fork needs a deliberate review/sync.
# Auto-merge is intentionally NOT enabled — dajoey/SpyJo carries local
# commits, so merge-upstream would be unsafe. Companion to
# scripts/check-upstream-impact.sh.
#
# Adapted from POWERFULMOVES/PMOVES-spynel weekly upstream-sync Action
# (35046f5c552f17a1ae7d492a6cd28d737b4faaf8), without the merge step.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail when upstream main moved past the last reviewed tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN_FILE=docs/tracking/upstream-reviewed.sha
          git remote add upstream https://github.com/agent0ai/spynel.git
          git fetch --quiet upstream main
          OUR="$(git rev-parse HEAD)"
          UP="$(git rev-parse upstream/main)"
          BASE="$(git merge-base HEAD upstream/main)"
          echo "fork HEAD:     $OUR"
          echo "upstream/main: $UP"
          echo "merge-base:    $BASE"
          if [ "$UP" = "$OUR" ]; then
            echo "OK: fork tip equals upstream/main."
            exit 0
          fi
          if [ "$BASE" = "$UP" ]; then
            echo "OK: fork is strictly ahead of upstream/main (local commits only)."
            exit 0
          fi
          # Upstream has commits this fork lacks. Silence is not a safe default:
          # a missing or unreadable pin is red, same as upstream moving past it.
          AHEAD="$(git rev-list --count HEAD..upstream/main)"
          LOCAL="$(git rev-list --count upstream/main..HEAD)"
          REVIEWED=""
          if [ -r "$PIN_FILE" ]; then REVIEWED="$(tr -d '[:space:]' < "$PIN_FILE")"; fi
          echo "reviewed pin:  ${REVIEWED:-<missing>}"
          if [ -n "$REVIEWED" ] && [ "$UP" = "$REVIEWED" ]; then
            echo "OK: upstream/main has $AHEAD commit(s) not merged here, but that tip was already reviewed (pin). Sync is a deliberate choice, not an alarm."
            exit 0
          fi
          echo "::error::upstream/main moved: $AHEAD commit(s) not in this fork ($LOCAL local). Review them (scripts/check-upstream-impact.sh), then either sync or set $PIN_FILE to $UP."
          git log --oneline "$BASE..upstream/main" | head -20
          exit 1
